name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Полная история: lastmod в sitemap берётся из дат коммитов.
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Пережатые картинки (AVIF/WebP) считаются ~1 мин — кэшируем по исходникам.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            public/img
            src/generated
          key: images-${{ hashFiles('media/**', 'scripts/optimize-images.mjs') }}

      # Текущий sitemap с сайта — чтобы после деплоя отправить в IndexNow
      # только изменившиеся страницы.
      - name: Previous sitemap
        run: curl -fsS https://proapp.uk/sitemap.xml -o prev-sitemap.xml || true

      # vite build + SSR-сборка + пререндер всех маршрутов в отдельные HTML
      # и sitemap.xml (scripts/prerender.mjs).
      - name: Build
        run: npm run build

      # Метка сборки: после деплоя ждём, пока GitHub Pages начнёт отдавать
      # именно эту версию, и только потом сбрасываем кэш Cloudflare.
      - name: Build marker
        run: echo "${{ github.sha }}" > dist/build.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # HTML и картинки лежат в кэше Cloudflare до месяца (Cache Rules зоны
      # proapp.uk) — после деплоя сбрасываем его целиком. Запрос с ?cb=…
      # идёт мимо кэша Cloudflare прямо в GitHub Pages.
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE: a43e4bdbea254b2a6ad7d6d83656359c
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "https://proapp.uk/build.txt?cb=$RANDOM$i" || true)
            [ "$live" = "${{ github.sha }}" ] && break
            sleep 10
          done
          echo "origin: $live"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: IndexNow (Bing, Yandex)
        continue-on-error: true
        run: node scripts/indexnow.mjs prev-sitemap.xml dist/sitemap.xml
