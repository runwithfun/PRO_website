name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Полная история: lastmod в sitemap берётся из дат коммитов.
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Пережатые картинки (AVIF/WebP) считаются ~1 мин — кэшируем по исходникам.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            public/img
            src/generated
          key: images-${{ hashFiles('media/**', 'scripts/optimize-images.mjs') }}

      # Текущий sitemap с сайта — чтобы после деплоя отправить в IndexNow
      # только изменившиеся страницы.
      - name: Previous sitemap
        run: curl -fsS https://proapp.uk/sitemap.xml -o prev-sitemap.xml || true

      # vite build + SSR-сборка + пререндер всех маршрутов в отдельные HTML
      # и sitemap.xml (scripts/prerender.mjs).
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: IndexNow (Bing, Yandex)
        continue-on-error: true
        run: node scripts/indexnow.mjs prev-sitemap.xml dist/sitemap.xml
