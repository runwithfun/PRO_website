<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — P.R.O.</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
      // GitHub Pages serves this file for any missing path.
      // Old invite links /invite/<code> go to the real page /invite/?code=<code>
      // (public/invite/index.html); app links /open/<section> that iOS didn't hand to the
      // app go to /open/?to=<section>; everything else stays an honest 404.
      (function (l) {
        var m = l.pathname.match(/^\/invite\/([^/?#]+)\/?$/);
        if (m) {
          var code = m[1];
          try { code = decodeURIComponent(code); } catch (e) {}
          l.replace('/invite/?code=' + encodeURIComponent(code) + l.hash);
        } else if (l.pathname === '/invite') {
          l.replace('/invite/' + l.search + l.hash);
        } else if (/^\/open\/.+/.test(l.pathname)) {
          l.replace('/open/?to=' + encodeURIComponent(l.pathname.slice(6).replace(/\/$/, '')));
        }
      })(window.location);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #000; color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      .code { color: #ec4899; font-weight: 700; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
      h1 { font-size: clamp(32px, 6vw, 56px); margin: 16px 0 8px; }
      p { color: #9ca3af; margin: 0 0 28px; }
      a { display: inline-block; background: #ec4899; color: #fff; text-decoration: none; font-weight: 600;
        padding: 14px 28px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>Page not found</h1>
      <p>The link is outdated or the address has a typo.</p>
      <a href="/">Back to P.R.O.</a>
    </main>
  </body>
</html>
