<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Open P.R.O.</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #000; color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 420px; }
      .code { color: #ec4899; font-weight: 700; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
      h1 { font-size: clamp(28px, 6vw, 44px); margin: 16px 0 8px; text-wrap: balance; }
      p { color: #9ca3af; margin: 0 0 28px; line-height: 1.5; }
      .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
      a { display: inline-block; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 999px; }
      .primary { background: #ec4899; color: #fff; }
      .ghost { color: #ec4899; border: 1px solid #3f3f46; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .desk .phone-only, .phone .desk-only { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">P.R.O.</div>
      <h1 class="phone-only">Open this in P.R.O.</h1>
      <h1 class="desk-only">Open P.R.O. on your iPhone</h1>
      <p class="phone-only">If the app didn't open by itself, tap the button below. No app yet? Get it from the App Store.</p>
      <p class="desk-only">This link opens a screen in the P.R.O. app. Your workouts, sleep and plan live on your iPhone.</p>
      <div class="actions">
        <a class="primary phone-only" id="open-app" href="proapp://">Open P.R.O.</a>
        <a class="ghost" href="https://apps.apple.com/us/app/p-r-o/id6749865568">Download on the App Store</a>
      </div>
    </main>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var phone = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        document.body.className = phone ? "phone" : "desk";
        var to = new URLSearchParams(location.search).get("to") || "";
        to = to.replace(/[^A-Za-z0-9\-\/]/g, "").replace(/^\/+/, "");
        document.getElementById("open-app").href = "proapp://" + to;
      })();
    </script>
  </body>
</html>
